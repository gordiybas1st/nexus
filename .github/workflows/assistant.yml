name: Build Assistant APK

on:
  push:
    branches: [main, master]
    paths:
      - "assistant/**"
      - ".github/workflows/assistant.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        env:
          # Optional repository secret; without it the app skips Credential Manager
          # and picks the account in the Calendar authorization step.
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: assistant-apk
          path: assistant/app/build/outputs/apk/debug/app-debug.apk

      # After the upload, so a failing test still leaves a downloadable APK.
      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: assistant/app/build/reports/tests/testDebugUnitTest/
